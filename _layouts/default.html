<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UserTextDB</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
          --bg-dark: #0a0a0c;
          --bg-card: #111116;
          --border-color: #1e1e26;
          --accent-teal: #2dd4a0;
          --accent-green: #1aad7e;
          --text-primary: #ffffff;
          --text-secondary: #a0a0a5;
          --font-family: 'Inter', sans-serif;
        }
        body {
          font-family: var(--font-family);
          background-color: var(--bg-dark);
          color: var(--text-primary);
          line-height: 1.6;
          max-width: 900px;
          margin: 0 auto;
          padding: 60px 20px;
          -webkit-font-smoothing: antialiased;
        }
        h1, h2, h3, h4, h5 { color: var(--text-primary); margin-top: 2em; margin-bottom: 0.8em; font-weight: 600; }
        h1 { font-size: 3rem; text-align: center; margin-top: 0; letter-spacing: -0.02em; }
        h2 { font-size: 1.75rem; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        h3 { font-size: 1.25rem; }
        p, li { color: var(--text-secondary); margin-bottom: 1em; font-size: 1.05rem; }
        ul, ol { margin-bottom: 1.5em; padding-left: 1.5em; }
        li { margin-bottom: 0.5em; }
        a { color: var(--accent-teal); text-decoration: none; transition: color 0.2s ease; }
        a:hover { color: var(--accent-green); }
        img { max-width: 100%; border-radius: 8px; border: 1px solid var(--border-color); }
        code { 
            background-color: var(--bg-card); 
            padding: 3px 6px; 
            border-radius: 4px; 
            color: var(--accent-teal); 
            font-family: 'Courier New', Courier, monospace; 
            font-size: 0.9em;
            border: 1px solid var(--border-color);
        }
        pre { background-color: var(--bg-card); padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border-color); }
        pre code { background-color: transparent; padding: 0; color: var(--text-secondary); border: none; }
        table { width: 100%; border-collapse: collapse; margin: 2em 0; border: 1px solid var(--border-color); border-radius: 8px; overflow: hidden; display: block; overflow-x: auto; }
        th, td { padding: 15px 20px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background-color: var(--bg-card); font-weight: 600; color: var(--text-primary); white-space: nowrap; }
        tr { background-color: var(--bg-dark); }
        tr:last-child td { border-bottom: none; }
        tr:hover { background-color: #111116; }
        blockquote { border-left: 4px solid var(--accent-teal); padding-left: 20px; color: var(--text-secondary); margin: 1.5em 0; font-style: italic; }
        hr { border: none; border-top: 1px solid var(--border-color); margin: 3em 0; }
        
        .header-brand { text-align: center; margin-bottom: 3rem; }
        .header-brand img { max-width: 250px; border: none; border-radius: 0; }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
